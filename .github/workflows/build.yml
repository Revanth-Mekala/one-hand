name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: cd build && ditto -c -k --keepParent OneHand.app OneHand.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OneHand
          path: build/OneHand.zip
